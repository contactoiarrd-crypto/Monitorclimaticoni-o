const inputDestino = document.getElementById("menDestinoInput");
const sugerenciasDiv = document.getElementById("menSugerencias");
const resultadoDiv = document.getElementById("menResultado");
const limpiarBtn = document.getElementById("menLimpiarBtn");
const radiosTemporada = document.querySelectorAll('input[name="menTemporada"]');

function obtenerTemporadaSeleccionada() {
  return document.querySelector('input[name="menTemporada"]:checked').value;
}

// Búsqueda dinámica
function procesarBusqueda() {
  const query = inputDestino.value.toLowerCase().trim();
  const temporada = obtenerTemporadaSeleccionada();
  const baseActual = baseElNino[temporada];

  if (query.length === 0) {
    limpiarBtn.style.display = "none";
    sugerenciasDiv.style.display = "none";
    resultadoDiv.style.display = "none";
    return;
  }

  limpiarBtn.style.display = "block";

  // Buscar coincidencias
  const matches = baseActual.filter(item =>
    item.nombres.some(n => n.includes(query)) || item.region.toLowerCase().includes(query)
  );

  if (matches.length > 0) {
    sugerenciasDiv.innerHTML = "";
    matches.forEach(item => {
      const div = document.createElement("div");
      div.className = "men-autocomplete-item";
      div.innerHTML = `<span>📍 <strong>${item.region}</strong></span> <span style="font-size:12px; font-weight:700;">${item.categoria}</span>`;
      div.onclick = () => {
        inputDestino.value = item.region;
        sugerenciasDiv.style.display = "none";
        mostrarTarjetaResultado(item, temporada);
      };
      sugerenciasDiv.appendChild(div);
    });
    sugerenciasDiv.style.display = "block";
    mostrarTarjetaResultado(matches[0], temporada);
  } else {
    sugerenciasDiv.style.display = "none";
    mostrarResultadoNeutral(query, temporada);
  }
}

function mostrarTarjetaResultado(data, temporada) {
  const nombreTemp = temporada === "DJF" ? "Diciembre a Febrero" : "Junio a Agosto";

  resultadoDiv.innerHTML = `
    <div class="men-res-card ${data.clase}">
      <div class="men-res-title">
        <span>${data.icono}</span>
        <span>${data.region}</span>
      </div>
      <div class="men-res-tag">
        Patrón NOAA: ${data.categoria} | Ventana: ${nombreTemp}
      </div>
      <div class="men-res-body">
        <p><strong>Comportamiento esperado:</strong> ${data.impacto}</p>
        <p><strong>💡 Recomendación para el viajero:</strong> ${data.consejo}</p>
      </div>
    </div>
  `;
  resultadoDiv.style.display = "block";
}

function mostrarResultadoNeutral(query, temporada) {
  const q = query.toLowerCase();
  const nombreTemp = temporada === "DJF" ? "Diciembre a Febrero" : "Junio a Agosto";
  let contextoEstacional = "se rige por su climatología estacional típica y por los sistemas meteorológicos regionales a corto plazo, más que por una señal determinante de El Niño en esta época.";

  if (q.includes("mendoza") || q.includes("san juan") || q.includes("cuyo")) {
    contextoEstacional = temporada === "DJF" 
      ? "se caracteriza en verano por clima semiárido, alta radiación solar, temperaturas elevadas y tormentas convectivas aisladas (a menudo con granizo) típicas de la orografía cordillerana."
      : "se caracteriza en invierno por días secos y soleados con noches muy frías y nevadas focalizadas en alta cordillera.";
  } else if (q.includes("bariloche") || q.includes("patagonia") || q.includes("ushuaia") || q.includes("calafate")) {
    contextoEstacional = temporada === "DJF"
      ? "presenta en época estival su régimen habitual de vientos del oeste, baja humedad, menor probabilidad de lluvias y noches frescas, respondiendo a frentes subpolares más que a El Niño."
      : "mantiene su régimen invernal con bajas temperaturas, heladas continuas y precipitaciones níveas asociadas a la oscilación antártica.";
  } else if (q.includes("cordoba") || q.includes("sierras") || q.includes("carlos paz")) {
    contextoEstacional = temporada === "DJF"
      ? "sigue su patrón habitual de verano: calor con episodios de tormentas orográficas intensas capaces de generar crecidas repentinas en ríos serranos."
      : "presenta inviernos secos y templados de día con marcado enfriamiento nocturno.";
  } else if (q.includes("europa") || q.includes("madrid") || q.includes("roma") || q.includes("paris")) {
    contextoEstacional = "responde a los patrones de circulación del Atlántico Norte (NAO) y a la estacionalidad europea habitual, sin correlación estadística directa unívoca de El Niño en el mapa de NOAA.";
  }

  resultadoDiv.innerHTML = `
    <div class="men-res-card men-res-neutral">
      <div class="men-res-title">
        <span>🌐</span>
        <span>${query.charAt(0).toUpperCase() + query.slice(1)}</span>
      </div>
      <div class="men-res-tag">
        Zona sin señal directa de El Niño en ${nombreTemp} (según NOAA Climate.gov)
      </div>
      <div class="men-res-body">
        <p><strong>¿Por qué no figura en el mapa?</strong> Para esta época del año (${nombreTemp}), este destino no presenta una correlación estadística robusta de exceso, déficit térmico o pluvial directamente atribuible a El Niño en los modelos globales.</p>
        <p><strong>Patrones comunes en esta época:</strong> Su comportamiento meteorológico <em>${contextoEstacional}</em></p>
        <p><strong>💡 Recomendación para el viajero:</strong> Planificá tu viaje tomando como referencia los promedios climáticos habituales del lugar y los pronósticos oficiales locales de corto plazo (a 3-7 días).</p>
      </div>
    </div>
  `;
  resultadoDiv.style.display = "block";
}

// Eventos
inputDestino.addEventListener("input", procesarBusqueda);

radiosTemporada.forEach(radio => {
  radio.addEventListener("change", () => {
    if (inputDestino.value.trim().length > 0) {
      procesarBusqueda();
    }
  });
});

limpiarBtn.addEventListener("click", () => {
  inputDestino.value = "";
  limpiarBtn.style.display = "none";
  sugerenciasDiv.style.display = "none";
  resultadoDiv.style.display = "none";
  inputDestino.focus();
});

document.addEventListener("click", function(e) {
  if (!document.getElementById("monitor-el-nino-widget").contains(e.target)) {
    sugerenciasDiv.style.display = "none";
  }
});
</script>
